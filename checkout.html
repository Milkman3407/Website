<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | 3D Print Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container checkout-hero">
      <a class="back-link" href="index.html">← Continue Shopping</a>
      <h1>Checkout</h1>
      <p class="hero-subtitle">Review your items and prepare a request summary.</p>
    </header>

    <main class="container checkout-grid">
      <section class="panel">
        <div class="panel-title-row">
          <h2>Your Cart</h2>
          <span class="panel-chip">Ready to review</span>
        </div>
        <div id="cart"></div>
        <p id="total" class="total"></p>
      </section>

      <form id="checkout-form" class="panel">
        <h3>Request Summary</h3>
        <p class="small-note">This page prepares a cart-only request summary.</p>
        <button id="submit-request" type="submit">Copy Request Summary</button>
        <pre id="request-summary" class="request-summary" aria-live="polite"></pre>
      </form>
    </main>

    <script src="products.js?v=airties-wall-mount"></script>
    <script src="checkout.js?v=airties-wall-mount"></script>
  </body>
</html>
