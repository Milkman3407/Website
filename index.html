<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Print Request Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <header class="container hero">
      <a class="cart-icon-link" href="checkout.html" aria-label="Go to checkout">
        <span class="cart-icon" aria-hidden="true">🛒</span>
        <span id="cart-count-badge" class="cart-count-badge">0</span>
      </a>
      <h1>3D Print Request Portal</h1>
      <p class="hero-subtitle">
        Request available shop prints, including field-ready wall brackets and mounts.
      </p>

      <a class="cta-button" href="#products">Browse Prints</a>
    </header>

    <main class="container">
      <section class="content-section">
        <div class="section-header">
          <h2>Available Prints</h2>
          <p>Current print queue items are ready for installation teams.</p>
        </div>
        <div id="products" class="product-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="container">
      <small>© 3D Print Requests</small>
    </footer>

    <script src="products.js?v=nokia-xs010x-q-bracket"></script>
    <script src="script.js?v=nokia-xs010x-q-bracket"></script>
  </body>
</html>
